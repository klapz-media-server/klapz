# Builds the Klapz packages from the server, web and FFmpeg releases and puts them in a draft
# GitHub release, whose notes give the version of each component and its changes since the
# previous Klapz release. Review the draft, then publish it.
#
# GitHub starts no workflow when a draft release is created, so run this one by hand
# (Actions > Build and release Klapz > Run workflow). If a draft already exists for the tag,
# it is filled in: its packages are replaced and the text written around the notes is kept.

name: Build and release Klapz

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Klapz version (defaults to today's date, e.g. 2026-11-21)"
        required: false
        type: string
      ffmpeg_version:
        description: "FFmpeg release version (defaults to its latest release)"
        required: false
        type: string
      web_version:
        description: "Web release version (defaults to its latest release)"
        required: false
        type: string
      server_version:
        description: "Server release version (defaults to its latest release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      ffmpeg: ${{ steps.resolve.outputs.ffmpeg }}
      web: ${{ steps.resolve.outputs.web }}
      server: ${{ steps.resolve.outputs.server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve versions
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
          WEB_VERSION: ${{ inputs.web_version }}
          SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          ARGS=()
          [ -n "$VERSION" ] && ARGS+=(--version "$VERSION")
          [ -n "$FFMPEG_VERSION" ] && ARGS+=(--ffmpeg-version "$FFMPEG_VERSION")
          [ -n "$WEB_VERSION" ] && ARGS+=(--web-version "$WEB_VERSION")
          [ -n "$SERVER_VERSION" ] && ARGS+=(--server-version "$SERVER_VERSION")
          node scripts/release-notes.js resolve "${ARGS[@]}"

  package:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            package: klapz-linux-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            package: klapz-linux-x64
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            package: klapz-darwin-arm64
          - name: macOS x64
            runner: macos-13
            platform: darwin
            arch: x64
            package: klapz-darwin-x64
          - name: Windows x64
            runner: windows-2022
            platform: win32
            arch: x64
            package: klapz-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/package-release.js             --version "${{ needs.resolve.outputs.version }}"             --ffmpeg-version "${{ needs.resolve.outputs.ffmpeg }}"             --web-version "${{ needs.resolve.outputs.web }}"             --server-version "${{ needs.resolve.outputs.server }}"             --platform "${{ matrix.platform }}"             --arch "${{ matrix.arch }}"             --output "${{ matrix.package }}"

      - name: Create archive
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win32" ]; then
            powershell -NoProfile -Command 'Compress-Archive -Path "${{ matrix.package }}/*" -DestinationPath "${{ matrix.package }}.zip"'
          else
            tar -czf "${{ matrix.package }}.tar.gz" "${{ matrix.package }}"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.tar.gz
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: [resolve, package]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Find an existing release
        id: existing
        run: |
          if gh release view "$TAG" --json isDraft,body > existing.json 2> /dev/null; then
            if [ "$(jq -r .isDraft existing.json)" != true ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            jq -r .body existing.json > existing-body.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        run: |
          node scripts/release-notes.js notes             --tag "$TAG"             --ffmpeg-version "${{ needs.resolve.outputs.ffmpeg }}"             --web-version "${{ needs.resolve.outputs.web }}"             --server-version "${{ needs.resolve.outputs.server }}"             --existing-body existing-body.md             --output notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the draft
        run: |
          (cd dist && sha256sum klapz-* > SHA256SUMS)
          if [ "${{ steps.existing.outputs.found }}" = true ]; then
            gh release edit "$TAG" --draft --title "Klapz $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA"               --title "Klapz $VERSION" --notes-file notes.md
          fi
