# Assembles the Klapz packages from the server, web and FFmpeg releases and puts them in a draft
# GitHub release, whose notes give the version of each component and its changes since the
# previous Klapz release. Review the draft, then publish it.
#
# GitHub starts no workflow when a draft release is created, so run this one by hand
# (Actions > Build and release Klapz > Run workflow). If a draft already exists for the tag,
# it is filled in: its packages are replaced and the text written around the notes is kept.
#
# Nothing is compiled here: the packages only gather binaries the other projects have already
# built, so every platform is assembled on one Linux runner.

name: Build and release Klapz

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Klapz version (defaults to today's date, e.g. 2026-11-21)"
        required: false
        type: string
      ffmpeg_version:
        description: "FFmpeg release version (defaults to its latest release)"
        required: false
        type: string
      web_version:
        description: "Web release version (defaults to its latest release)"
        required: false
        type: string
      server_version:
        description: "Server release version (defaults to its latest release)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    name: Package and draft the release
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Once, so that every package and the notes use the same versions even if a component
      # releases during the run.
      - name: Resolve versions
        id: v
        env:
          VERSION: ${{ inputs.version }}
          FFMPEG_VERSION: ${{ inputs.ffmpeg_version }}
          WEB_VERSION: ${{ inputs.web_version }}
          SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          ARGS=()
          [ -n "$VERSION" ] && ARGS+=(--version "$VERSION")
          [ -n "$FFMPEG_VERSION" ] && ARGS+=(--ffmpeg-version "$FFMPEG_VERSION")
          [ -n "$WEB_VERSION" ] && ARGS+=(--web-version "$WEB_VERSION")
          [ -n "$SERVER_VERSION" ] && ARGS+=(--server-version "$SERVER_VERSION")
          node scripts/release-notes.js resolve "${ARGS[@]}"

      - name: Assemble the packages
        run: |
          mkdir dist
          for target in linux/x64 linux/arm64 darwin/x64 darwin/arm64 win32/x64; do
            platform="${target%/*}"
            arch="${target#*/}"
            package="klapz-${platform/win32/windows}-$arch"
            echo "::group::$package"
            node scripts/package-release.js \
              --version "${{ steps.v.outputs.version }}" \
              --ffmpeg-version "${{ steps.v.outputs.ffmpeg }}" \
              --web-version "${{ steps.v.outputs.web }}" \
              --server-version "${{ steps.v.outputs.server }}" \
              --platform "$platform" \
              --arch "$arch" \
              --output "$package"
            if [ "$platform" = win32 ]; then
              (cd "$package" && zip -qr "../dist/$package.zip" .)
            else
              tar -czf "dist/$package.tar.gz" "$package"
            fi
            echo "::endgroup::"
          done
          (cd dist && sha256sum klapz-* > SHA256SUMS)
          ls -l dist

      - name: Find an existing release
        id: existing
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft,body > existing.json 2> /dev/null; then
            if [ "$(jq -r .isDraft existing.json)" != true ]; then
              echo "::error::Release $TAG is already published"
              exit 1
            fi
            jq -r .body existing.json > existing-body.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the release notes
        run: |
          node scripts/release-notes.js notes \
            --tag "${{ steps.v.outputs.tag }}" \
            --ffmpeg-version "${{ steps.v.outputs.ffmpeg }}" \
            --web-version "${{ steps.v.outputs.web }}" \
            --server-version "${{ steps.v.outputs.server }}" \
            --existing-body existing-body.md \
            --output notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the draft
        env:
          TAG: ${{ steps.v.outputs.tag }}
          TITLE: Klapz ${{ steps.v.outputs.version }}
        run: |
          if [ "${{ steps.existing.outputs.found }}" = true ]; then
            gh release edit "$TAG" --draft --title "$TITLE" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --target "$GITHUB_SHA" \
              --title "$TITLE" --notes-file notes.md
          fi
